name: Build NeteasePlayer Plugin
on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git-lfs ffmpeg pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Qt 5.15.2 for aarch64
        run: git clone --depth 1 https://github.com/Lyrecoul/qt-5.15.2-for-aarch64-dictpen-linux.git

      - name: Clone GCC toolchain
        run: git clone --depth 1 https://github.com/Lyrecoul/aarch64-dictpen-linux-gnu-gcc-toolchain.git

      - name: Clone dictpen-libs
        run: git clone --depth 1 https://github.com/Lyrecoul/dictpen-libs.git

      - name: Set up environment
        run: |
          echo "$PWD/qt-5.15.2-for-aarch64-dictpen-linux/bin" >> $GITHUB_PATH
          echo "$PWD/aarch64-dictpen-linux-gnu-gcc-toolchain/bin" >> $GITHUB_PATH

      - name: Prepare FFmpeg headers
        run: |
          set -e
          mkdir -p plugin/include
          # 用 pkg-config 获取 FFmpeg 头文件路径
          echo "=== pkg-config cflags ==="
          pkg-config --cflags libavformat libavcodec libavutil libswresample 2>&1 || true
          # 直接从已知位置复制（Ubuntu 多架构路径）
          for dir in /usr/include/x86_64-linux-gnu/libav* /usr/include/libav*; do
            if [ -d "$dir" ]; then
              cp -r "$dir" plugin/include/
              echo "Copied: $dir"
            fi
          done
          echo "=== include 目录 ==="
          ls -la plugin/include/
          echo "=== swresample.h 位置 ==="
          find plugin/include -name "swresample.h" 2>/dev/null || echo "NOT FOUND in include"
          dpkg -L libavutil-dev 2>/dev/null | grep -i swresample || echo "not in libavutil-dev"
          dpkg -L libavcodec-dev 2>/dev/null | grep -i swresample || echo "not in libavcodec-dev"

      - name: Verify qmake
        run: |
          set -e
          echo "=== qmake version ==="
          ./qt-5.15.2-for-aarch64-dictpen-linux/bin/qmake --version
          echo "=== gcc version ==="
          aarch64-dictpen-linux-gnu-g++ --version | head -1
          echo "=== dictpen-libs ==="
          ls dictpen-libs/ | head -20

      - name: Build with qmake
        run: |
          set -e
          cd plugin
          echo "=== Running qmake ==="
          ../qt-5.15.2-for-aarch64-dictpen-linux/bin/qmake NeteasePlayer.pro
          echo "=== qmake done, running make ==="
          make -j$(nproc) 2>&1
          echo "=== make done ==="
          ls -lh build/

      - name: Strip debug symbols
        run: |
          set -e
          aarch64-dictpen-linux-gnu-strip build/libnetease_player.so
          ls -lh build/libnetease_player.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnetease_player
          path: build/libnetease_player.so
